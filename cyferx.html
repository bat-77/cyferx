<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyferX — Crypto payments, finally built for commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --ink:#14171C;
    --ink-soft:#3B3E44;
    --muted:#7A7D82;
    --line:#E3DFD4;
    --line-strong:#CFC9BA;
    --accent:#1D3AF2;
    --accent-deep:#0B1F99;
    --accent-wash:#E9EBFD;
    --success:#1F8A5F;
    --success-wash:#E7F4EC;
    --danger:#C23B22;
    --danger-wash:#FBEBE7;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --serif:'Fraunces', Georgia, serif;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--accent-wash);}

  /* ---------- Focus ---------- */
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Shell ---------- */
  .app-shell{display:flex; min-height:100vh;}
  .rail{
    width:232px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 16px;
  }
  .rail-brand{display:flex; align-items:center; gap:9px; padding:4px 8px 22px; }
  .rail-mark{width:26px;height:26px;border-radius:7px;background:var(--ink);display:flex;align-items:center;justify-content:center;}
  .rail-mark svg{width:14px;height:14px;}
  .rail-brand-text{font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:-0.01em;}
  .rail-mode-toggle{display:flex; background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:3px; margin-bottom:20px;}
  .rail-mode-toggle button{flex:1; border:none; background:transparent; padding:6px 0; font-size:12px; font-weight:600; color:var(--muted); border-radius:99px;}
  .rail-mode-toggle button.active{background:var(--ink); color:#fff;}
  .rail-nav{display:flex; flex-direction:column; gap:2px;}
  .rail-nav button{
    display:flex; align-items:center; gap:10px; text-align:left; background:transparent; border:none;
    padding:9px 10px; border-radius:var(--radius-s); font-size:13.5px; color:var(--ink-soft); font-weight:500;
  }
  .rail-nav button svg{width:16px;height:16px;flex-shrink:0;opacity:0.75;}
  .rail-nav button:hover{background:var(--bg);}
  .rail-nav button.active{background:var(--accent-wash); color:var(--accent-deep); font-weight:600;}
  .rail-nav button.active svg{opacity:1;}
  .rail-spacer{flex:1;}
  .rail-foot{border-top:1px solid var(--line); padding-top:14px; display:flex; align-items:center; gap:10px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
  .rail-foot-text{overflow:hidden;}
  .rail-foot-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rail-foot-sub{font-size:11.5px;color:var(--muted);font-family:var(--mono);}

  .main{flex:1; min-width:0; overflow-y:auto;}
  .main-inner{max-width:820px; margin:0 auto; padding:40px 40px 80px;}
  .page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; gap:16px; flex-wrap:wrap;}
  .page-title{font-family:var(--serif); font-size:26px; font-weight:600; letter-spacing:-0.01em; margin:0;}
  .page-sub{color:var(--muted); font-size:13.5px; margin-top:4px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; border-radius:var(--radius-s); font-size:14px; font-weight:600;
    border:1px solid transparent; transition:transform .08s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn-accent{background:var(--accent); color:#fff;}
  .btn-accent:hover{background:var(--accent-deep);}
  .btn-secondary{background:var(--surface); color:var(--ink); border-color:var(--line-strong);}
  .btn-secondary:hover{border-color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--ink-soft); padding:9px 12px;}
  .btn-ghost:hover{background:var(--bg);}
  .btn-block{width:100%;}
  .btn-lg{padding:14px 20px; font-size:15px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* ---------- Cards ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:20px;}
  .row{display:flex; align-items:center; justify-content:space-between;}

  /* ---------- Landing ---------- */
  .landing{min-height:100vh;}
  .landing-nav{display:flex; align-items:center; justify-content:space-between; padding:22px 44px; max-width:1180px; margin:0 auto;}
  .landing-nav .rail-brand{padding:0;}
  .landing-nav-links{display:flex; gap:28px; font-size:13.5px; font-weight:500; color:var(--ink-soft);}
  .landing-hero{max-width:1180px; margin:0 auto; padding:64px 44px 40px; display:grid; grid-template-columns:1.1fr 0.9fr; gap:56px; align-items:center;}
  .eyebrow-line{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:18px;}
  .eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--success);}
  .hero-headline{font-family:var(--serif); font-size:52px; line-height:1.04; font-weight:600; letter-spacing:-0.015em; margin:0 0 20px;}
  .hero-headline em{font-style:italic; color:var(--accent);}
  .hero-sub{font-size:16px; line-height:1.6; color:var(--ink-soft); max-width:440px; margin-bottom:30px;}
  .hero-ctas{display:flex; gap:12px; margin-bottom:36px;}
  .hero-diagram{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px; color:var(--muted);}
  .hero-diagram .seg{padding:5px 10px; border:1px solid var(--line-strong); border-radius:5px; background:var(--surface);}
  .hero-diagram .seg.hot{border-color:var(--accent); color:var(--accent-deep); background:var(--accent-wash);}
  .hero-diagram .arrow{opacity:0.5;}

  .hero-visual{background:var(--ink); border-radius:24px; padding:26px; position:relative; overflow:hidden;}
  .hero-visual::before{content:"";position:absolute; inset:0; background:radial-gradient(600px 300px at 80% -10%, rgba(29,58,242,0.35), transparent 60%);}
  .demo-card{position:relative; background:#1B1E25; border:1px solid #2C303A; border-radius:16px; padding:22px; color:#fff;}
  .demo-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .demo-merchant{display:flex; align-items:center; gap:8px; font-size:13px; color:#C9CCD3;}
  .verified-chip{display:inline-flex; align-items:center; gap:4px; background:rgba(31,138,95,0.18); color:#5FD8A2; font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px;}
  .demo-product{font-size:14px; color:#9EA2AC; margin-bottom:4px;}
  .demo-amount{font-family:var(--mono); font-size:38px; font-weight:600; margin-bottom:22px;}
  .demo-pins{display:flex; gap:9px; margin-bottom:18px;}
  .demo-pin-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid #4A4E58;}
  .demo-pin-dot.filled{background:var(--accent); border-color:var(--accent);}
  .demo-cta{background:var(--accent); color:#fff; text-align:center; padding:12px; border-radius:10px; font-size:13.5px; font-weight:600;}

  .landing-strip{border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--surface); padding:14px 44px; }
  .strip-inner{max-width:1180px; margin:0 auto; display:flex; gap:40px; overflow-x:auto; font-family:var(--mono); font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em;}

  .landing-section{max-width:1180px; margin:0 auto; padding:70px 44px;}
  .section-head{max-width:560px; margin-bottom:40px;}
  .section-kicker{font-size:12.5px; color:var(--accent); font-weight:600; margin-bottom:10px;}
  .section-title{font-family:var(--serif); font-size:30px; font-weight:600; letter-spacing:-0.01em; margin:0 0 12px;}
  .section-body{color:var(--ink-soft); font-size:14.5px; line-height:1.6;}
  .problem-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  .problem-card{border:1px solid var(--line); border-radius:var(--radius-m); padding:20px; background:var(--surface);}
  .problem-card .q{font-family:var(--mono); font-size:12px; color:var(--danger); margin-bottom:10px;}
  .problem-card p{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0;}

  .flow-steps{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; background:var(--surface);}
  .flow-step{display:grid; grid-template-columns:140px 1fr; gap:18px; padding:18px 22px; border-bottom:1px solid var(--line);}
  .flow-step:last-child{border-bottom:none;}
  .flow-step .label{font-family:var(--mono); font-size:12px; color:var(--muted); padding-top:2px;}
  .flow-step .content strong{display:block; font-size:14.5px; margin-bottom:3px;}
  .flow-step .content span{font-size:13px; color:var(--muted);}

  .landing-footer{border-top:1px solid var(--line); padding:30px 44px; max-width:1180px; margin:0 auto; display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted);}

  /* ---------- Login ---------- */
  .auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{width:380px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); padding:36px 32px; text-align:center;}
  .auth-mark{width:44px;height:44px;border-radius:12px;background:var(--ink); display:flex; align-items:center; justify-content:center; margin:0 auto 20px;}
  .auth-title{font-family:var(--serif); font-size:21px; font-weight:600; margin-bottom:6px;}
  .auth-sub{font-size:13.5px; color:var(--muted); margin-bottom:26px;}
  .google-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:12px; border:1px solid var(--line-strong); border-radius:var(--radius-s); background:#fff; font-size:14px; font-weight:600;
  }
  .google-btn:hover{border-color:var(--ink); background:var(--bg);}
  .auth-fine{font-size:11.5px; color:var(--muted); margin-top:20px; line-height:1.5;}
  .auth-loading{display:flex; flex-direction:column; align-items:center; gap:14px; padding:14px 0;}
  .spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line); border-top-color:var(--accent); animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .onboard-row{display:flex; align-items:center; gap:12px; padding:10px 0; text-align:left; border-bottom:1px solid var(--line); font-size:13.5px;}
  .onboard-row:last-child{border-bottom:none;}
  .onboard-check{width:18px;height:18px;border-radius:50%;background:var(--success-wash); color:var(--success); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  /* ---------- Dashboard ---------- */
  .balance-card{background:linear-gradient(155deg, #14171C 0%, #1D2130 60%, #182046 100%); color:#fff; border-radius:20px; padding:28px 26px; margin-bottom:22px; position:relative; overflow:hidden;}
  .balance-card::after{content:"";position:absolute; right:-40px; top:-40px; width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(29,58,242,0.4), transparent 70%);}
  .balance-label{font-size:12.5px; color:#B7BAC4; margin-bottom:6px; position:relative;}
  .balance-amount{font-family:var(--mono); font-size:40px; font-weight:600; letter-spacing:-0.01em; margin-bottom:22px; position:relative;}
  .balance-actions{display:flex; gap:10px; position:relative;}
  .balance-actions button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14); color:#fff; padding:12px 8px; border-radius:12px; font-size:12px; font-weight:600;
  }
  .balance-actions button:hover{background:rgba(255,255,255,0.16);}
  .balance-actions svg{width:16px;height:16px;}

  .section-label{font-size:12.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin:26px 0 10px;}
  .asset-row{display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--line);}
  .asset-row:last-child{border-bottom:none;}
  .asset-left{display:flex; align-items:center; gap:11px;}
  .asset-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:700; color:#fff;}
  .asset-icon.sol{background:linear-gradient(135deg,#9945FF,#14F195);}
  .asset-icon.usdc{background:#2775CA;}
  .asset-name{font-size:14px; font-weight:600;}
  .asset-qty{font-size:12px; color:var(--muted); font-family:var(--mono);}
  .asset-value{font-family:var(--mono); font-size:14px; font-weight:600;}

  .activity-row{display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .activity-row:last-child{border-bottom:none;}
  .activity-row:hover{background:var(--bg); margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:8px;}
  .activity-left{display:flex; align-items:center; gap:11px;}
  .activity-icon{width:34px;height:34px;border-radius:50%;background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-soft);}
  .activity-name{font-size:14px; font-weight:600;}
  .activity-meta{font-size:12px; color:var(--muted);}
  .activity-amount{font-family:var(--mono); font-size:14px; font-weight:600;}
  .activity-amount.out{color:var(--ink);}
  .activity-amount.in{color:var(--success);}
  .status-pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px;}
  .status-pill.confirmed{background:var(--success-wash); color:var(--success);}
  .status-pill.pending{background:#FBF3DE; color:#A87706;}
  .status-pill.failed{background:var(--danger-wash); color:var(--danger);}
  .empty-state{border:1px dashed var(--line-strong); border-radius:var(--radius-m); padding:34px 20px; text-align:center; color:var(--muted); font-size:13.5px;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:11px 13px; border:1px solid var(--line-strong); border-radius:var(--radius-s); font-size:14px; font-family:inherit; background:var(--surface); color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash);}
  .field-hint{font-size:11.5px; color:var(--muted); margin-top:5px;}
  .amount-input-wrap{position:relative;}
  .amount-input-wrap .prefix{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-family:var(--mono);}
  .amount-input-wrap input{padding-left:26px; font-family:var(--mono);}

  .toggle{position:relative; width:38px; height:22px; border-radius:99px; background:var(--line-strong); border:none; flex-shrink:0;}
  .toggle.on{background:var(--success);}
  .toggle::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s ease;}
  .toggle.on::after{transform:translateX(16px);}

  /* ---------- Checkout modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(20,23,28,0.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; backdrop-filter:blur(2px);}
  .checkout-modal{width:390px; max-width:100%; background:var(--surface); border-radius:22px; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,0.28);}
  .checkout-head{background:var(--ink); color:#fff; padding:20px 22px 18px; display:flex; align-items:center; justify-content:space-between;}
  .checkout-brand{display:flex; align-items:center; gap:7px; font-size:12.5px; color:#B7BAC4;}
  .checkout-close{background:rgba(255,255,255,0.1); border:none; color:#fff; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .checkout-body{padding:26px 22px;}
  .checkout-merchant{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .merchant-badge{width:40px;height:40px;border-radius:11px;background:var(--accent-wash); color:var(--accent-deep); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
  .checkout-product{font-size:13.5px; color:var(--muted); margin-bottom:2px;}
  .checkout-amount-display{font-family:var(--mono); font-size:34px; font-weight:600; text-align:center; margin:18px 0 6px;}
  .checkout-currency{text-align:center; color:var(--muted); font-size:12.5px; margin-bottom:22px;}
  .amount-chip-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .amount-chip{padding:10px 0; text-align:center; border:1px solid var(--line-strong); border-radius:var(--radius-s); font-family:var(--mono); font-size:13.5px; font-weight:600; background:var(--surface);}
  .amount-chip.active{border-color:var(--accent); background:var(--accent-wash); color:var(--accent-deep);}
  .checkout-available{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:12px 0; border-top:1px solid var(--line); margin-top:6px;}
  .checkout-line{display:flex; justify-content:space-between; font-size:13.5px; padding:9px 0; border-bottom:1px solid var(--line);}
  .checkout-line:last-child{border-bottom:none;}
  .checkout-line .k{color:var(--muted);}
  .checkout-line .v{font-weight:600; font-family:var(--mono); font-size:12.5px;}
  .pin-dots{display:flex; justify-content:center; gap:16px; margin:30px 0;}
  .pin-dot{width:16px;height:16px;border-radius:50%; border:2px solid var(--line-strong);}
  .pin-dot.filled{background:var(--ink); border-color:var(--ink);}
  .pin-dot.err{border-color:var(--danger); background:var(--danger);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .keypad button{padding:15px 0; font-size:18px; font-weight:500; background:var(--bg); border:1px solid var(--line); border-radius:12px;}
  .keypad button:hover{background:var(--line);}
  .keypad button.ghost{background:transparent; border:none; color:var(--muted); font-size:13px;}
  .processing-wrap{display:flex; flex-direction:column; align-items:center; padding:30px 0 10px; gap:16px;}
  .lifecycle{display:flex; flex-direction:column; gap:10px; width:100%; margin-top:6px;}
  .lifecycle-step{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted);}
  .lifecycle-step .dot{width:9px;height:9px;border-radius:50%; border:2px solid var(--line-strong); flex-shrink:0;}
  .lifecycle-step.done{color:var(--ink);}
  .lifecycle-step.done .dot{background:var(--success); border-color:var(--success);}
  .lifecycle-step.active{color:var(--accent-deep); font-weight:600;}
  .lifecycle-step.active .dot{background:var(--accent); border-color:var(--accent); animation:pulse 1s ease infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .success-check{width:60px;height:60px;border-radius:50%; background:var(--success-wash); color:var(--success); display:flex; align-items:center; justify-content:center; margin:6px auto 16px;}
  .success-check svg{width:28px;height:28px;}

  /* ---------- Receipt ---------- */
  .receipt-card{border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden;}
  .receipt-top{background:var(--success-wash); padding:26px 24px; text-align:center;}
  .receipt-body{padding:22px 24px;}

  /* ---------- Spending controls ---------- */
  .limit-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line);}
  .limit-row:last-child{border-bottom:none;}
  .limit-input{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:14px; font-weight:600;}
  .limit-input input{width:80px; text-align:right; padding:6px 8px; border:1px solid var(--line-strong); border-radius:6px; font-family:var(--mono); font-weight:600;}
  .perm-row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line);}
  .perm-row:last-child{border-bottom:none;}
  .perm-left{display:flex; align-items:center; gap:10px;}

function render(){ App.innerHTML=''; App.appendChild(Root()); }
const App = document.getElementById('app');
function h(tag, attrs={}, children=[]){
  const el = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') el.className = attrs[k];
    else if(k==='html') el.innerHTML = attrs[k];
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    if(typeof c === 'string') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}
function fmt(n, d=2){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d}); }
function showToast(msg){

}
function go(section){ state.section = section; render(); window.scrollTo(0,0); }

/* ====================== LANDING ====================== */

  const c = state.checkout;
  const wrap = h('div',{});
  wrap.appendChild(h('div',{style:'font-weight:600;font-size:15px;text-align:center;'},'Enter CyferX PIN'));
  wrap.appendChild(h('div',{class:'pin-dots'}, [0,1,2,3].map(i=> h('div',{class:'pin-dot'+(i<c.pin.length?' filled':'')+(c.pinError?' err':'')}))));
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  wrap.appendChild(h('div',{class:'keypad'}, keys.map(k=>{
    if(k==='') return h('span');
    if(k==='del') return h('button',{class:'ghost', onclick:()=>{ c.pin=c.pin.slice(0,-1); c.pinError=false; render(); }},'⌫');
    return h('button',{onclick:()=>handlePinKey(k)}, k);
  })));
  return wrap;

function handlePinKey(k){
  const c = state.checkout;
  if(c.pin.length>=4) return;
  c.pin += k;
  if(c.pin.length===4){
    render();
    setTimeout(()=>{
      if(c.pin==='2468'){ startProcessing(); }
      else { c.pinError=true; render(); setTimeout(()=>{ c.pin=''; c.pinError=false; render(); }, 550); }
    }, 250);
  } else render();
}
function startProcessing(){
  const c = state.checkout;
  c.stage='processing'; c.lifecycleIdx=0; render();
  const steps = ['AWAITING_PAYMENT','AUTHORIZED','PROCESSING','CONFIRMED','FULFILLED'];
  const tick = ()=>{
    c.lifecycleIdx++;
    if(c.lifecycleIdx < steps.length){ render(); setTimeout(tick, 480); }
    else completePayment();
  };
  setTimeout(tick, 480);
}
function completePayment(){
  const c = state.checkout;
  state.wallet.usdc -= c.amount;
  state.orderCounter++;
  const payId = 'PAY-'+state.orderCounter;
  const orderId = 'ORDER-'+(19000+Math.floor(Math.random()*999));
  c.payId = payId; c.orderId = orderId;
  state.transactions.unshift({id:'tx'+Date.now(), name:'SentryBase', kind:'out', amount:c.amount, asset:'USDC', date:'Just now', status:'confirmed', payId});
  state.merchant.revenue += c.amount;
  state.merchant.payments += 1;
  state.merchant.recent.unshift({customer:state.user?.username||'you', product:c.product.name, amount:c.amount});
  c.stage='success'; render();
}

function MerchantOverview(){
  const m = state.merchant;
  const wrap = h('div',{});
  wrap.appendChild(h('div',{class:'page-head'},[h('h1',{class:'page-title'},'CyferX for Business'), h('div',{class:'page-sub'},m.name+' · Verified Merchant')]));
  wrap.appendChild(h('div',{class:'stat-grid'},[
    ['Revenue','$'+fmt(m.revenue)],['Payments', m.payments],['Customers', m.customers],['Pending', m.pending],
  ].map(([l,v])=>h('div',{class:'stat-card'},[h('div',{class:'stat-label'},l), h('div',{class:'stat-value'},v)]))));
  wrap.appendChild(h('div',{class:'section-label'},'Recent Payments'));
  const table = h('table',{class:'tx-table'});
  table.appendChild(h('tr',{},[h('th',{},'Customer'), h('th',{},'Product'), h('th',{},'Amount')]));
  m.recent.slice(0,8).forEach(r=> table.appendChild(h('tr',{},[h('td',{},r.customer), h('td',{},r.product), h('td',{style:'font-family:var(--mono);'},'$'+fmt(r.amount))])));
  wrap.appendChild(h('div',{class:'card'},[table]));
  return wrap;
}
function MerchantProducts(){
  const m = state.merchant;
  const wrap = h('div',{});
  wrap.appendChild(h('div',{class:'page-head'},[h('h1',{class:'page-title'},'Products'), h('button',{class:'btn btn-primary', onclick:addProduct},'+ New Product')]));
  wrap.appendChild(h('div',{class:'card'}, m.products.map(p=>h('div',{class:'limit-row'},[
    h('div',{},[h('div',{style:'font-weight:600;font-size:13.5px;'}, p.name), h('div',{style:'font-size:12px;color:var(--muted);'}, p.id)]),
    h('div',{style:'font-family:var(--mono);font-weight:600;'},'$'+fmt(p.price)+' '+p.currency),
  ]))));
  return wrap;
}
function addProduct(){
  const m = state.merchant;
  const id = 'p'+(m.products.length+1);
  m.products.push({id, name:'New Product '+(m.products.length+1), price:25, currency:'USDC'});
  showToast('Product created'); render();
}
function MerchantPayments(){
  const m = state.merchant;
  const wrap = h('div',{});
  wrap.appendChild(h('div',{class:'page-head'},[h('h1',{class:'page-title'},'Payments')]));
  const table = h('table',{class:'tx-table'});
  table.appendChild(h('tr',{},[h('th',{},'Customer'), h('th',{},'Product'), h('th',{},'Amount'), h('th',{},'Status')]));
  m.recent.forEach(r=> table.appendChild(h('tr',{},[h('td',{},r.customer), h('td',{},r.product), h('td',{style:'font-family:var(--mono);'},'$'+fmt(r.amount)), h('td',{},h('span',{class:'status-pill confirmed'},'confirmed'))])));
  wrap.appendChild(h('div',{class:'card'},[table]));
  return wrap;
}
function MerchantLinks(){
  const wrap = h('div',{});
  wrap.appendChild(h('div',{class:'page-head'},[h('h1',{class:'page-title'},'Payment Links')]));
  wrap.appendChild(h('div',{class:'link-card'},[
    h('div',{},[
      h('div',{style:'font-weight:600;font-size:14px;'},'SentryBase — 1,000 Tokens'),
      h('div',{style:'color:var(--muted);font-size:12.5px;font-family:var(--mono);'},'$50 USDC · pay.cyferx.com/sentrybase/tok1000'),
    ]),
    h('div',{style:'display:flex;gap:8px;'},[
      h('button',{class:'btn btn-secondary', onclick:()=>copyText('https://pay.cyferx.com/sentrybase/tok1000')},[h('span',{html:ICON.copy}),'Copy Link']),
      h('button',{class:'btn btn-secondary', onclick:()=>showToast('QR code shown')},[h('span',{html:ICON.qr}),'QR Code']),
    ]),
  ]));
  wrap.appendChild(h('div',{class:'page-sub', style:'margin-top:14px;'},'Share this link on your site, Discord, X, Telegram or email — customers pay without ever seeing a wallet address.'));
  return wrap;
}
function MerchantAPI(){
  const wrap = h('div',{});
  wrap.appendChild(h('div',{class:'page-head'},[h('h1',{class:'page-title'},'Developers')]));
  wrap.appendChild(h('div',{class:'section-label'},'Create a payment'));
  wrap.appendChild(h('div',{class:'code-block', html:`<span class="k">POST</span> /payments

{
  <span class="s">"product_id"</span>: <span class="s">"prod_123"</span>,
  <span class="s">"amount"</span>: 50,
  <span class="s">"currency"</span>: <span class="s">"USDC"</span>,
  <span class="s">"customer_id"</span>: <span class="s">"cyf_48291"</span>
}

<span class="c">// response</span>
{
  <span class="s">"payment_id"</span>: <span class="s">"pay_84921"</span>,
  <span class="s">"status"</span>: <span class="s">"awaiting_payment"</span>,
  <span class="s">"checkout_url"</span>: <span class="s">"https://pay.cyferx.com/..."</span>
}`}));
  wrap.appendChild(h('div',{class:'section-label'},'Webhooks'));
  wrap.appendChild(h('div',{class:'card'}, ['payment.created','payment.authorized','payment.processing','payment.confirmed','payment.failed','payment.refunded'].map(w=>
    h('div',{class:'limit-row'},[h('span',{style:'font-family:var(--mono);font-size:13px;'},w), h('span',{class:'status-pill confirmed'},'active')])
  )));
  return wrap;
}

render();
</script>
</body>
</html>
